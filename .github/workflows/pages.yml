name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit toolchain for moderate or higher
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: CNAME is medelite.com.mx
        run: |
          test -f dist/CNAME
          grep -qx 'medelite.com.mx' dist/CNAME
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/favicon.ico
          test -s dist/sitemap.xml
          grep -q "Sitemap: https://medelite.com.mx/sitemap.xml" dist/robots.txt
          grep -q "https://medelite.com.mx/es/calidad" dist/sitemap.xml
          grep -q "https://medelite.com.mx/en/calidad" dist/sitemap.xml
          grep -q "https://medelite.com.mx/fr/calidad" dist/sitemap.xml
          grep -q "Content-Security-Policy" dist/index.html
          for page in en/canada en/galeria en/hospital-joya en/especialidades es/calidad en/calidad fr/calidad; do
            grep -q "<h1" "dist/$page/index.html"
            if grep -q 'text-sm text-muted">…</p>' "dist/$page/index.html"; then
              echo "placeholder still in dist/$page/index.html" >&2
              exit 1
            fi
          done

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
